<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitBol</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body, html {
      height: 100%;
      background: linear-gradient(135deg, #001F3F 30%, #004080 70%);
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: white;
    }

    .top-section {
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .top-section img {
      width: 150px; /* Tamaño del logo */
      height: 150px; /* Tamaño del logo */
      border-radius: 50%; /* Hace que el logo sea redondo */
      border: 5px solid #003366; /* Borde azul marino */
      margin-bottom: 20px;
    }

    .top-section h1 {
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .top-section p {
      font-size: 1rem;
      color: #ddd;
      max-width: 300px;
    }

    .bottom-section {
      flex: 0.7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
     
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }

    .buttons a {
      text-align: center;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .buttons a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-section">
      <img src="assets/img/logo.jpeg" alt="DigitBol Logo">
      <h1>Digitalizando Bolivia</h1>
      <p>Impulsamos el desarrollo tecnológico del país con sitios web, blockchain e inteligencia artificial.</p>
    </div>
    <div class="bottom-section">
      <div class="buttons">
        <a href="#">🌐 Sitio Web</a>
        <a href="#">📸 Instagram</a>
        <a href="#">✉️ Contacto</a>
        <a href="#">📘 Aprende Blockchain</a>
        <a href="#">🤖 Aprende IA</a>
      </div>
    </div>
  </div>
</body>
</html>
