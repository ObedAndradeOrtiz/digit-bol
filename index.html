<!DOCTYPE html>
<html>
<head>
  <title>Usuario B</title>
</head>
<body>
  <h2>Usuario B</h2>
  <button onclick="register()">Registrarse como 'B'</button>

  <script>
    let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    let ws = new WebSocket('ws://spamiora.ddns.net:8081');

    ws.onmessage = async (msg) => {
      const data = JSON.parse(msg.data);
      if (data.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({ type: 'call', name: 'B', to: data.from, sdp: answer }));
      }
      if (data.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    };

    pc.ontrack = (e) => {
      const audio = new Audio();
      audio.srcObject = e.streams[0];
      audio.play();
    };

    async function register() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      ws.send(JSON.stringify({ type: 'register', name: 'B' }));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: 'call', name: 'B', to: 'A', candidate: event.candidate }));
        }
      };
    }
  </script>
</body>
</html>
