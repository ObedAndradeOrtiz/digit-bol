<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DigitBol</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
            rel="stylesheet">
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body, html { height: 100%; background: linear-gradient(135deg, #001F3F 30%, #004080 70%); color: white; }
    .container { display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    img { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #003366; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    p { font-size: 1rem; color: #ddd; max-width: 300px; margin-bottom: 30px; }
    input, button { padding: 12px; margin: 10px 0; border-radius: 30px; border: none; width: 100%; max-width: 300px; }
    input { outline: none; }
    button { background-color: #007BFF; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #grupo-link {display:none;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 16px;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
    .error { color: #ffcccc; font-size: 0.9rem; margin-top: 10px; }
            .whatsapp-float {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #25D366;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  text-align: center;
  font-size: 30px;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease;
}

.whatsapp-float:hover {
  transform: scale(1.1);
  background-color: #1ebc59;
}
  </style>
    </head>
    <body>
        <div class="container">
            <img src="assets/img/logo.jpeg" alt="DigitBol Logo">
            <h1>Evento Gratuito - DigitBol</h1>
            <h3 style="margin-bottom: 1%;">Digitalizando Bolivia</h3>
            <p>Regístrate para aprender a crear tu propia página web gratis con IA el
                sábado 10 de mayo a las 5:00PM.</p>
            <p><strong>¡Cupos limitados!</strong></p>
            <input type="text" id="codigo" placeholder="Código de invitación">
            <input type="text" id="nombre" placeholder="Tu nombre">
            <input type="text" id="telefono" placeholder="Número de WhatsApp">
            <button onclick="enviarFormulario()">Registrarse</button>

            <p class="error" id="mensaje"></p>
            <a id="grupo-link" href="https://chat.whatsapp.com/HrjXtoHDBxv5UJXNGXmMEY" target="_blank">Unirme al grupo de WhatsApp</a>

        </div>
 <a href="https://wa.me/59177348087" 
   class="whatsapp-float" 
   target="_blank" 
   title="Contactar por WhatsApp">
  <i class="fab fa-whatsapp"></i>
</a>
        <script>
    const codigosValidos = ["DIGI1", "DIGI2","DIGI3", "DIGI4", "DIGI5", "DIGI6", "DIGI"]; // Añade más códigos si deseas

    function enviarFormulario() {
      const codigo = document.getElementById("codigo").value.trim().toUpperCase();
      const nombre = document.getElementById("nombre").value.trim();
      const telefono = document.getElementById("telefono").value.trim();
      const mensaje = document.getElementById("mensaje");
      const grupoLink = document.getElementById("grupo-link");

      mensaje.textContent = "";
      grupoLink.style.display = "none";

      if (!codigo || !nombre || !telefono) {
        mensaje.textContent = "Por favor completa todos los campos.";
        return;
      }

      if (!codigosValidos.includes(codigo)) {
        mensaje.textContent = "Código de invitación inválido.";
        return;
      }

      fetch("https://spamiora.ddns.net/api/numeros", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombre, numero: telefono, codigo: codigo})
      })
      .then(res => {
        if (res.ok) {
          grupoLink.style.display = "block";
          mensaje.textContent = "¡Registro exitoso "+nombre+"!";
        } else {
          throw new Error("Error al registrar.");
        }
      })
      .catch(() => {
        mensaje.textContent = "Hubo un error. Intenta más tarde.";
      });
    }
  </script>
    </body>
</html>
